# H2 em arquivo (backend/data/, ignorado pelo git): os dados continuam depois de reiniciar.
# Para começar do zero, pare o backend e apague a pasta backend/data.
spring.datasource.url=jdbc:h2:file:${NESHA_H2_ARQUIVO:./data/nesha}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cria as contas de teste (docs/CONTAS_DE_TESTE.md) se ainda não existirem.
nesha.dados-de-teste=true
